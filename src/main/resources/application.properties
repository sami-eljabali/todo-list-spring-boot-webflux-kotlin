# ─── Server ──────────────────────────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ─── HTTP ────────────────────────────────────────────────────────────────────
spring.http.codecs.max-in-memory-size=4MB
spring.http.converters.preferred-json-mapper=jackson

# ─── WebFlux ─────────────────────────────────────────────────────────────────
spring.webflux.format.date=yyyy-MM-dd
spring.webflux.format.date-time=yyyy-MM-dd'T'HH:mm:ss
spring.webflux.format.time=HH:mm:ss
spring.webflux.problemdetails.enabled=true

# ─── Threads ─────────────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ─── R2DBC ───────────────────────────────────────────────────────────────────
spring.r2dbc.url=r2dbc:postgresql://localhost/todolist
spring.r2dbc.username=user
spring.r2dbc.password=password
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=15m
spring.r2dbc.properties.lock_timeout=10s
spring.r2dbc.properties.statement_timeout=30s
spring.transaction.default-timeout=30s

# ─── SQL Init ────────────────────────────────────────────────────────────────
spring.sql.init.mode=always

# ─── Actuator ────────────────────────────────────────────────────────────────
management.server.port=9090
management.endpoints.web.exposure.include=health,info,env,openapi,swaggerui
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# ─── SpringDoc ───────────────────────────────────────────────────────────────
springdoc.show-actuator=true
springdoc.use-management-port=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.eljabali.sami.todo=DEBUG
logging.level.sql=TRACE
logging.level.web=DEBUG
logging.group.r2dbc=org.springframework.r2dbc,org.springframework.data.r2dbc
logging.level.r2dbc=DEBUG

# ─── App ─────────────────────────────────────────────────────────────────────
app.allowed-origin-urls=http://localhost:3000,http://localhost:4200
app.version=1.0-dev-${git.commit.id:local}
app.base-url=http://localhost:8080
